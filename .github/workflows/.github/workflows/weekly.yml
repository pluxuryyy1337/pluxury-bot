name: Бот — воскресная пачка постов

on:
  schedule:
    # Время в UTC. Екатеринбург/Курган = UTC+5 → каждое воскресенье в 12:00.
    - cron: "0 7 * * 0"
  workflow_dispatch:        # кнопка для ручного запуска

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RATE_MULTIPLIER: ${{ secrets.RATE_MULTIPLIER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить библиотеки
        run: pip install -r requirements.txt
      - name: Собрать и отправить пачку
        run: python bot.py weekly
      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "pluxury-bot"
          git config user.email "pluxury-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Состояние бота"
            git pull --rebase
            git push
          fi
